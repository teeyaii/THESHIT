name: Thai OCR synthetic integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thai-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      THESHIT_REQUIRE_THAI_OCR: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-tha tesseract-ocr-eng fonts-noto-core fontconfig
      - run: python -m pip install -r requirements-oss.txt
      - run: python -m unittest discover -s tests -p test_pdf_text_engine.py -v

name: Public discovery connectivity smoke
on:
  pull_request:
    paths:
      - 'research_discovery.py'
      - 'discovery_smoke.py'
      - 'tests/test_discovery_smoke.py'
      - '.github/workflows/discovery-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python discovery_smoke.py --output outputs/public-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-discovery-smoke-status
          path: outputs/public-smoke.json
          if-no-files-found: ignore
          retention-days: 7

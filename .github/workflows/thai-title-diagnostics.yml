name: Thai public title diagnostics
on:
  pull_request:
    paths:
      - 'thai_title_diagnostics.py'
      - 'tests/test_thai_title_diagnostics.py'
      - '.github/workflows/thai-title-diagnostics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python -m pip install -r requirements-oss.txt -c requirements-core-linux-py311.constraints.txt
      - run: python -m unittest discover -s tests -p test_thai_title_diagnostics.py -v
      - run: python thai_title_diagnostics.py --output outputs/title-diagnostics.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-title-distance-metrics-only
          path: outputs/title-diagnostics.json
          if-no-files-found: ignore
          retention-days: 7

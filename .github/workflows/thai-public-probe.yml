name: Thai public PDF first-page pilot
on:
  pull_request:
    paths:
      - 'thai_public_probe.py'
      - 'tests/test_thai_public_probe.py'
      - '.github/workflows/thai-public-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-oss.txt
      - run: python thai_public_probe.py --output outputs/thai-public-pilot.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thai-public-pilot-metrics-only
          path: outputs/thai-public-pilot.json
          if-no-files-found: ignore
          retention-days: 7

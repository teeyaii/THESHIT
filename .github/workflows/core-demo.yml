name: Synthetic end-to-end research demo
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-oss.txt
      - run: python theshit_cli.py demo --output outputs/SYNTHETIC_E2E
      - run: python theshit_cli.py verify --output outputs/SYNTHETIC_E2E
      - uses: actions/upload-artifact@v4
        with:
          name: THESHIT-SYNTHETIC-NOT-RESEARCH-EVIDENCE
          path: outputs/SYNTHETIC_E2E/
          retention-days: 7

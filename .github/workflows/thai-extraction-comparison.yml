name: Thai public native extraction comparison
on:
  pull_request:
    paths:
      - 'thai_extraction_comparison.py'
      - 'tests/test_thai_extraction_comparison.py'
      - '.github/workflows/thai-extraction-comparison.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python -m pip install -r requirements-oss.txt -c requirements-core-linux-py311.constraints.txt
      - run: python -m unittest discover -s tests -p test_thai_extraction_comparison.py -v
      - run: python thai_extraction_comparison.py --output outputs/thai-extraction-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Thai-native-title-comparison-metrics-only
          path: outputs/thai-extraction-comparison.json
          if-no-files-found: ignore
          retention-days: 7
